name: Generate Daily Brief

# Writes the day's post from the news and podcast feeds and saves it straight to the
# database. The live site reads posts on every request, so it appears without a deploy.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC daily. GitHub may start scheduled runs a few minutes late.
  workflow_dispatch: # Also runnable by hand from the Actions tab.

jobs:
  generate:
    runs-on: ubuntu-latest
    # A normal run takes well under a minute; this stops a hung request running for hours.
    timeout-minutes: 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Runs the TypeScript directly, with no build step
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and save today's brief
        run: npm run generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
