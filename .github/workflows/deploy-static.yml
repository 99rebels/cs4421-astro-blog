name: Deploy Static Site via AWS CDK
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Site Dependencies
        run: npm ci

      - name: Build Astro Static Site
        run: npm run build

      # The CDK app is a separate project with its own package.json
      - name: Install CDK Dependencies
        working-directory: AWS-cdk
        run: npm ci

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Must run from AWS-cdk so cdk.json is found and '../dist' resolves to the built site
      - name: Deploy Infrastructure & Assets with AWS CDK
        working-directory: AWS-cdk
        run: npx cdk deploy --require-approval never
