name: Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # A real Postgres next to the job for the integration tests, removed when the job ends.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        # Steps start only once Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U blog -d blog"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Reuses the npm cache between runs

      - name: Install dependencies
        run: npm ci # Clean, deterministic install from package-lock.json

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://blog:blog@localhost:5432/blog

      - name: Build
        run: npm run build
